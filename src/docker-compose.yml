services:
    mariadb:
      container_name: mariadb
      build: ./requirements/mariadb
      env_file: .env
      restart: always
      volumes:
        - db_vol:/var/lib/mysql
      networks:
        - inception

    wordpress:
      container_name: wordpress
      build: ./requirements/wordpress
      restart: always
      depends_on:
        - mariadb
      environment:
        - .env
      volumes:
        - wordpress_data:/var/www/html
      networks:
        - inception

    nginx:
      container_name: nginx
      build: ./requirements/nginx
      restart: always
      ports:
        - "443:443"
      volumes:
        - wordpress_data:/var/www/html
      depends_on:
        - wordpress
      networks:
        - inception

volumes:
  db_vol:
    driver: local
    driver_opts:
      type: none
      device: '/home/agrimald/data/db_vol'
      o: bind
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: '/home/agrimald/data/wordpress_data'
      o: bind
networks:
  inception:
    driver: bridge
