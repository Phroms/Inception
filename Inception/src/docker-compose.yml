version: '3.7'
services:
    mariadb:
      container_name: mariadb
      build: ./requirements/mariadb
      env_file: .env
      restart: always
      expose:
        - "3306"
      volumes:
        - db_vol:/var/lib/mysql
      networks:
        - inception

    wordpress:
      container_name: wordpress
      build: ./requirements/wordpress
      restart: always
      environment:
        WORDPRESS_DB_HOST: mariadb:3306
        WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
        WORDPRESS_DB_USER: ${MYSQL_USER}
        WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      ports:
        - "8080:80"
      volumes:
        - wordpress_data:/var/www/html
      networks:
        - inception
volumes:
  db_vol:
    driver: local
    driver_opts:
      type: none
      device: '/home/agrimald/data/db_vol'
      o: bind
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: '/home/agrimald/data/wordpress_data'
      o: bind
networks:
  inception:
    driver: bridge
